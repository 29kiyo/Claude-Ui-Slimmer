<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Claude UI Slimmer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Claude UI Slimmer</h1>

  <div class="control">
    <label for="attachmentSize">添付ファイルサイズ</label>
    <div class="control-row">
      <input type="range" id="attachmentSize" min="40" max="120" step="5" value="120">
      <input type="number" id="attachmentSizeNumber" min="40" max="120" step="5" value="120" class="number-input">
      <span class="unit">px</span>
    </div>
  </div>

  <div class="control">
    <label for="inputMaxHeight">入力欄の最大高さ</label>
    <div class="control-row">
      <input type="range" id="inputMaxHeight" min="80" max="458" step="10" value="200">
      <input type="number" id="inputMaxHeightNumber" min="80" max="458" step="10" value="200" class="number-input">
      <span class="unit">px</span>
    </div>
  </div>

  <div class="control control-toggle">
    <label for="scrollFixToggle" class="toggle-label">
      <input type="checkbox" id="scrollFixToggle" checked>
      入力欄に拡大ボタンを表示(長文の選択・スクロールがしやすくなります)
    </label>
  </div>

  <button type="button" id="resetBtn">リセット</button>

  <p class="hint">claude.aiのタブを開いた状態で操作してください</p>

  <script src="popup.js"></script>
</body>
</html>
