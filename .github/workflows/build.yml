name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ (例: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version number (strip leading v)
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json version (repo本体を直接更新)
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"${{ steps.version.outputs.version }}\"/" manifest.json
          echo "=== manifest.json ==="
          cat manifest.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "chore: bump manifest version to ${{ steps.version.outputs.version }} (${{ github.event.inputs.tag }})"
          git push origin HEAD:main

      - name: Create zip
        run: |
          mkdir -p build
          cp -r manifest.json src icons build/
          cd build
          zip -r "../claude-ui-slimmer-${{ github.event.inputs.tag }}.zip" manifest.json src icons
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: claude-ui-slimmer-${{ github.event.inputs.tag }}.zip
